<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b11"><title>Меню</title>
<style>
:root{--bg:#070b11;--card:#0d141d;--line:#1d2836;--ink:#f4f6f9;--mute:#8d9bad;--g1:#f8d27a;--g2:#e1a63d;--gold:#f0bd55}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Inter,Roboto,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 110px}
.top{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo svg{width:44px;height:44px;flex:none}
.logo h1{font-size:34px;line-height:1;font-weight:700}
.logo small{display:block;margin-top:5px;font-size:9.5px;letter-spacing:.14em;color:var(--mute)}
.pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:30px;padding:9px 12px;text-align:left}
.pill svg{width:20px;height:20px;color:var(--gold)}
.pill small{display:block;font-size:11px;color:var(--mute)}.pill b{font-size:13px;font-weight:500}
.cartb{position:relative;width:54px;height:54px;border:1px solid var(--line);border-radius:22px;display:grid;place-items:center}
.cartb svg{width:26px}.badge{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:linear-gradient(#f8d27a,#e1a63d);color:#1a1205;font-size:12px;font-weight:700;display:grid;place-items:center}
.banner{position:relative;margin-top:18px;border:1px solid var(--line);border-radius:22px;overflow:hidden;aspect-ratio:2.35/1;background:#10161e}
.banner img{position:absolute;right:0;top:0;height:100%;width:62%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.banner .tx{position:relative;padding:15px 16px;max-width:66%}
.banner i{font-style:normal;font-size:9.5px;letter-spacing:.14em;color:var(--gold);font-weight:600}
.banner h2{font-size:20px;line-height:1.1;margin:6px 0}
.banner p{font-size:10px;color:#cfd6df;line-height:1.35}
.go{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px;border-radius:20px;background:linear-gradient(#f8d27a,#e1a63d);color:#1a1205;font-weight:600;font-size:12px}
.go svg{width:13px}
.dots{position:absolute;bottom:9px;left:50%;display:flex;gap:6px}.dots span{width:7px;height:7px;border-radius:50%;background:#4a5058}.dots span:first-child{background:var(--g1)}
.grid{display:grid;gap:8px;margin-top:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;text-align:left}
.cat img{width:100%;aspect-ratio:1.6;object-fit:cover;border-radius:11px;display:block}
.cat div{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 5px 5px;font-size:12px;line-height:1.2;min-height:38px}
.cat svg{width:15px;color:var(--gold);flex:none}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.sec h3{font-size:24px}.sec button{color:var(--gold);font-size:13px;display:flex;gap:6px;align-items:center}.sec svg{width:15px}
.dish{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:10px}
.dish img{width:38%;max-width:170px;height:104px;object-fit:cover;border-radius:12px;flex:none}
.dish .in{flex:1;display:flex;flex-direction:column;position:relative;padding:4px 4px 2px 0}
.dish b{font-weight:500;font-size:15.5px}.dish p{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.3;padding-right:46px}
.dish .pr{margin-top:auto;font-size:16px;font-weight:600;padding-top:6px}
.plus{position:absolute;right:0;bottom:0;width:38px;height:36px;border-radius:10px;background:linear-gradient(#f8d27a,#e1a63d);color:#1a1205;font-size:24px;font-weight:600;line-height:1}
.step{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:8px;font-weight:600}
.step button{width:30px;height:30px;border-radius:9px;background:linear-gradient(#f8d27a,#e1a63d);color:#1a1205;font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:20px -14px 14px;padding:0 14px}
.chips button{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:var(--mute)}
.chips .on{background:linear-gradient(#f8d27a,#e1a63d);color:#1a1205;border-color:transparent;font-weight:600}
.empty{text-align:center;color:var(--mute);padding:70px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:#090e15;border-top:1px solid var(--line);z-index:5}
nav div{max-width:480px;margin:auto;display:flex;padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute);padding:4px 0}
nav svg{width:26px;height:26px}nav .on{color:var(--gold);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:20}.sheet.open{display:flex}
.panel{width:100%;max-width:480px;margin:auto;max-height:88%;overflow:auto;background:#0d141d;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.panel h2{font-size:22px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:14px 0}
textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:14px inherit;resize:none;margin-bottom:12px}
.panel .go{width:100%;justify-content:center;padding:14px;font-size:15px;margin:0}.go:disabled{opacity:.5}
.link{width:100%;padding:12px;color:var(--mute);font-size:14px}
.msg{background:#2a1a1a;border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px}
.ok{text-align:center;padding:24px 0}.ok div{font-size:54px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
<style>
html{touch-action:manipulation}input,textarea,select{font-size:16px!important}
.logo h1{font-size:27px}.logo svg{width:38px;height:38px}
.lang{border:1px solid var(--line);border-radius:18px;height:54px;padding:0 11px;font-size:13px;font-weight:700;color:var(--gold)}
.ph{aspect-ratio:1.6;display:grid;place-items:center;font-size:26px;background:#141d29;border-radius:11px;width:100%}
.iw{position:relative;width:38%;max-width:170px;flex:none}.iw img,.iw .ph{width:100%!important;max-width:none!important;height:104px!important;object-fit:cover;border-radius:12px;display:grid}
.hit{position:absolute;left:6px;top:6px;background:linear-gradient(#f8d27a,#e1a63d);color:#1a1205;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.hb{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}.hb.on{color:#f0bd55}.hb svg{width:16px}.hb.on svg{fill:currentColor}
.dimg{width:100%;height:190px;object-fit:cover;border-radius:14px;margin-bottom:12px}
.c2{display:inline-block;padding:4px 10px;border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--mute);margin:0 6px 6px 0}
.mod{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.q2{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0;font-size:20px;font-weight:700}.q2 button{width:40px;height:40px;border-radius:12px;background:linear-gradient(#f8d27a,#e1a63d);color:#1a1205;font-size:22px}
.adm{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px}
.aw{max-width:560px;margin:auto}.aw .chips{margin:14px 0;padding:0;flex-wrap:wrap}
.ah{display:flex;justify-content:space-between;align-items:center}.ah h2{font-size:24px}.ah .go{margin:0}
.f{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:3px 0;font-family:inherit}
.qr{flex:none;background:#fff;padding:6px;border-radius:10px;height:fit-content}.qr img,.qr canvas{width:112px!important;height:112px!important;max-width:none!important;border-radius:0!important;display:block}
.aw .dish{margin-bottom:10px}.aw .dish img.th{width:60px;height:46px}.sm{padding:8px 12px!important;margin:0!important}
.hint{font-size:12px;color:var(--mute);line-height:1.4;margin:6px 0}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kp b{display:block;font-size:20px;margin-top:4px}
summary{font-size:13px;color:var(--gold);margin:6px 0;cursor:pointer}
.dim{opacity:.55}.stb{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.78);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}.stb.o{background:#7a1f1f}.stb.c{color:#f8d27a}
</style></head><body>
<div class="app" id="app"><div class="empty">…</div></div>
<nav><div id="nav"></div></nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="adm" id="adm"></div>

  $('panel').innerHTML=`<div class="ok"><div>✅</div><h2>${t('sent')}</h2><p style="color:var(--mute);margin-top:6px">${inTg?t('sentY'):t('sentX')}</p></div>`
   +(link&&!inTg?`<a class="go" style="text-decoration:none;justify-content:center;padding:14px;margin:0" href="${link}">${t('tgo')}</a>`:'')+`<button class="link" onclick="closeCart()">${t('close')}</button>`;
  if(inTg)setTimeout(()=>{try{Telegram.WebApp.close()}catch{}},1200);else if(r.isNew&&link)setTimeout(()=>location.href=link,900);
 }catch(e){$('status').innerHTML=`<div class="msg">${t('err')}</div>`;b.disabled=false}
}
/* ===== админ ===== */
function askPass(){mode='pass';$('sheet').classList.add('open');$('panel').innerHTML='<h2>Вход для администратора</h2><input class="f" id="pw" type="password" placeholder="Пароль" autocomplete="off"><div id="status"></div><button class="go" style="margin:8px 0 0" onclick="login()">Войти</button><button class="link" onclick="closeCart()">Отмена</button>'}
async function login(){
 const r=await api('/api/admin/login',{password:$('pw').value});
 if(!r.token){$('status').innerHTML='<div class="msg">'+(r.error==='rate'?'Слишком много попыток':'Неверный пароль')+'</div>';return}
 tok=r.token;role=r.role;A=await api('/api/admin/state');closeCart();at='tables';$('adm').style.display='block';admR();
}
function admX(){$('adm').style.display='none';render()}
const sv=async(sec,val)=>{const r=await api('/api/admin/save',{section:sec,value:val||A[sec]});await loadCfg();return r};
const upd=(sec,i,k,v)=>{A[sec][i][k]=k==='p'?Number(v):v;sv(sec)};
function rm(sec,i){if(!confirm('Удалить?'))return;const x=A[sec][i];A[sec].splice(i,1);if(sec==='cats'){A.dishes=A.dishes.filter(d=>d.c!==x.id);sv('dishes')}sv(sec);admR()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function pic(inp,cb){const f=inp.files[0];if(!f)return cb('');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,420/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(f)}
const link=x=>location.origin+'/?table='+encodeURIComponent(x.id);
const inp=(sec,i,k,ph,ty='text')=>`<input class="f" type="${ty}" placeholder="${ph}" title="${ph}" value="${esc(A[sec][i][k]??'')}" onchange="upd('${sec}',${i},'${k}',this.value)">`;
const chk=(sec,i,k,lb)=>`<label class="hint" style="margin-right:12px"><input type="checkbox" ${A[sec][i][k]?'checked':''} onchange="upd('${sec}',${i},'${k}',this.checked?1:0)"> ${lb}</label>`;
const catImg2=x=>{const s=imgOf(x);return s?`<img class="th" src="${s}" alt="" style="width:60px;height:46px;border-radius:8px;object-fit:cover;flex:none">`:'<span style="font-size:24px">🍽</span>'};
const box=c=>`<div class="dish" style="display:block;padding:12px">${c}</div>`;
const SF=[['restaurant','Название ресторана'],['currency','Валюта'],['token','API токен Telegram-бота'],['adminChat','Chat ID админов (через запятую)'],['kitchenChat','Chat ID кухни'],['barChat','Chat ID бара'],['open','Открытие, например 09:00'],['close','Закрытие, например 23:00'],['closedMsg','Сообщение вне часов работы'],['backupTime','Время автобэкапа в Telegram, например 03:00'],['payInfo','Реквизиты для QR-перевода'],['promoTitle','Акция: заголовок'],['promoText','Акция: текст']];
function admR(){
 const T={tables:'Столы',menu:'Меню',staff:'Официанты',rep:'Отчёты',hist:'История',...(role==='owner'?{bot:'Настройки',adm:'Админы',log:'Журнал'}:{})};
 let h=`<div class="aw"><div class="ah"><h2>Админ-панель</h2><button class="go" onclick="admX()">Выйти</button></div><div class="chips">${Object.entries(T).map(([k,v])=>`<button class="${k===at?'on':''}" onclick="admTab('${k}')">${v}</button>`).join('')}</div>`;
 if(at==='tables')h+=box('<b>Новый стол</b><input class="f" id="nt" placeholder="Номер стола, например 5"><button class="go sm" onclick="addT()">Создать стол и QR-код</button>')
  +A.tables.map((x,i)=>`<div class="dish"><div class="qr" id="qr${i}"></div><div class="in">${inp('tables',i,'name','Название')}<small class="hint" style="word-break:break-all">${esc(link(x))}</small><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button class="go sm" onclick="dlQR(${i})">Скачать QR</button><button class="link" style="width:auto" onclick="rm('tables',${i})">Удалить</button></div></div></div>`).join('');
 if(at==='menu'){
  h+=box('<b>Новый каталог</b><input class="f" id="cn" placeholder="Название"><input type="file" id="cp" accept="image/*" class="f"><button class="go sm" onclick="addC()">Добавить каталог</button>')
  +A.cats.map((c,i)=>`<div class="dish" style="display:block;padding:10px"><div style="display:flex;gap:8px;align-items:center">${catImg2(c)}${inp('cats',i,'t','Название')}<button class="link" style="width:auto" onclick="rm('cats',${i})">✕</button></div><details><summary>Переводы</summary>${inp('cats',i,'t_tg','Номи тоҷикӣ')}${inp('cats',i,'t_en','English name')}</details></div>`).join('')
  +box(`<b>Новое блюдо</b><select class="f" id="dc">${A.cats.map(c=>`<option value="${c.id}">${esc(c.t)}</option>`).join('')}</select><input class="f" id="dn" placeholder="Название"><input class="f" id="dd" placeholder="Описание"><input class="f" id="dp" type="number" placeholder="Цена"><input type="file" id="dpic" accept="image/*" class="f"><button class="go sm" onclick="addD()">Добавить блюдо</button>`)
  +A.dishes.map((d,i)=>`<div class="dish" style="display:block;padding:10px"><div style="display:flex;gap:8px;align-items:center">${catImg2(d)}${inp('dishes',i,'n','Название')}<button class="link" style="width:auto" onclick="rm('dishes',${i})">✕</button></div>${inp('dishes',i,'d','Описание')}<div style="display:flex;gap:8px">${inp('dishes',i,'p','Цена','number')}<select class="f" onchange="upd('dishes',${i},'c',this.value)">${A.cats.map(c=>`<option value="${c.id}" ${c.id===d.c?'selected':''}>${esc(c.t)}</option>`).join('')}</select><select class="f" onchange="upd('dishes',${i},'dest',this.value)"><option value="kitchen" ${d.dest!=='bar'?'selected':''}>Кухня</option><option value="bar" ${d.dest==='bar'?'selected':''}>Бар</option></select></div>${chk('dishes',i,'pop','Популярное')}${chk('dishes',i,'hit','Хит')}<div style="display:flex;gap:8px;align-items:center"><select class="f" onchange="setSt(${i},this.value)"><option value="" ${ast(d)===''?'selected':''}>✅ В наличии</option><option value="cooking" ${ast(d)==='cooking'?'selected':''}>🟡 Готовится (таймер)</option><option value="out" ${ast(d)==='out'?'selected':''}>🔴 Закончился</option></select>${ast(d)==='cooking'?`<input class="f" type="number" style="width:100px" title="минут до готовности" placeholder="мин" value="${Math.max(1,Math.round((d.readyAt-Date.now())/6e4))}" onchange="setMin(${i},this.value)">`:''}</div>
  <details><summary>Подробнее: переводы, состав, допы</summary>${inp('dishes',i,'n_tg','Номи тоҷикӣ')}${inp('dishes',i,'n_en','English name')}${inp('dishes',i,'d_tg','Тавсифи тоҷикӣ')}${inp('dishes',i,'d_en','English description')}${inp('dishes',i,'weight','Вес, например 300 г')}${inp('dishes',i,'kcal','Калории')}${inp('dishes',i,'time','Время приготовления, мин')}${inp('dishes',i,'allergens','Аллергены')}${inp('dishes',i,'mods','Допы через запятую: Без лука, Доп. сыр=10, Средняя прожарка')}
  ${[['spicy','🌶 Острое'],['veg','🥬 Вегетарианское'],['gf','🌾 Без глютена']].map(([x,l])=>`<label class="hint" style="margin-right:10px"><input type="checkbox" ${(d.tags||[]).includes(x)?'checked':''} onchange="tgl(${i},'${x}',this.checked)"> ${l}</label>`).join('')}</details></div>`).join('');
 }
 if(at==='staff')h+=box('<b>Новый официант</b><input class="f" id="wf" placeholder="ФИО"><input class="f" id="wp" placeholder="Номер телефона"><input class="f" id="wu" placeholder="Telegram username (@name)"><input class="f" id="wt" placeholder="Закреплённые столы через запятую (пусто = все)"><button class="go sm" onclick="addW()">Добавить официанта</button><p class="hint">Официант должен один раз нажать /start у бота.</p>')
  +A.waiters.map((w,i)=>`<div class="dish" style="display:block;padding:10px">${inp('waiters',i,'fio','ФИО')}${inp('waiters',i,'phone','Телефон')}${inp('waiters',i,'username','@username')}${inp('waiters',i,'tables','Столы (пусто = все)')}<div style="display:flex;justify-content:space-between;align-items:center"><span class="hint">${w.chatId?'✅ подключён к боту':'⏳ ждёт /start в боте'}</span><button class="link" style="width:auto" onclick="rm('waiters',${i})">Удалить</button></div></div>`).join('');
 if(at==='rep')h+='<div class="chips">'+[1,7,30].map(n=>`<button onclick="rep(${n})">${n===1?'24 часа':n+' дней'}</button>`).join('')+'<button onclick="dl(\'/api/admin/export.csv\',\'orders.csv\')">⬇ Excel (CSV)</button></div><div id="rp"></div>';
 if(at==='hist')h+='<div id="hs"></div>';if(at==='log')h+='<div id="lg"></div>';
 if(at==='bot'){const s=A.settings;h+=box('<b>Настройки и Telegram</b>'+SF.map(([k,l])=>`<label class="hint">${l}</label><input class="f" id="s_${k}" value="${esc(s[k]||'')}">`).join('')
  +`<label class="hint">Фото баннера акции</label><input type="file" id="sp" accept="image/*" class="f"><label class="hint">Блюдо дня</label><select class="f" id="s_dayDish"><option value="">— нет —</option>${A.dishes.map(d=>`<option value="${d.id}" ${d.id===s.dayDish?'selected':''}>${esc(d.n)}</option>`).join('')}</select><label class="hint">Новый пароль владельца (оставьте пустым, чтобы не менять)</label><input class="f" id="s_newPass" type="password" autocomplete="new-password"><button class="go sm" onclick="saveS()">Сохранить</button><p class="hint" id="bs">${s.botName?'🤖 Бот: @'+esc(s.botName):'Бот не подключён'}</p><p class="hint">Chat ID можно узнать командой /id у бота. Админ, кухня и бар должны один раз нажать /start.</p>`)
  +box('<b>Резервная копия</b><button class="go sm" onclick="dl(\'/api/admin/backup\',\'backup.json\')">⬇ Скачать backup</button> <button class="go sm" onclick="bnow()">📨 В Telegram сейчас</button><p class="hint">Автокопия уходит админам в Telegram раз в сутки.</p><label class="hint">Восстановить из файла</label><input type="file" id="rs" accept=".json" class="f" onchange="restore(this)">')}
 if(at==='adm')h+=box('<b>Новый администратор</b><input class="f" id="an" placeholder="Имя"><input class="f" id="ap" type="password" placeholder="Пароль"><select class="f" id="ar"><option value="manager">Менеджер (меню, столы, отчёты)</option><option value="owner">Владелец (всё)</option></select><button class="go sm" onclick="addA()">Добавить</button>')
  +A.admins.map((a,i)=>`<div class="dish" style="display:block;padding:10px">${inp('admins',i,'name','Имя')}<select class="f" onchange="upd('admins',${i},'role',this.value)"><option value="manager" ${a.role!=='owner'?'selected':''}>Менеджер</option><option value="owner" ${a.role==='owner'?'selected':''}>Владелец</option></select><input class="f" type="password" placeholder="Новый пароль (пусто = не менять)" onchange="upd('admins',${i},'pass',this.value)"><button class="link" onclick="rm('admins',${i})">Удалить</button></div>`).join('');
 $('adm').innerHTML=h+'</div>';
 if(at==='tables')A.tables.forEach((x,i)=>{new QRCode($('qr'+i),{text:link(x),width:280,height:280})});
 if(at==='rep')rep(7);if(at==='hist')hist();if(at==='log')logv();
}
const ast=d=>d.status==='out'?'out':d.status==='cooking'&&d.readyAt>Date.now()?'cooking':'';
async function admTab(k){at=k;if(k==='menu'||k==='staff'){const s=await api('/api/admin/state');A.dishes=s.dishes;A.waiters=s.waiters}admR()}
function setSt(i,v){const d=A.dishes[i];d.status=v;if(v==='cooking')d.readyMin=d.readyMin||15;sv('dishes');delete d.readyMin;d.readyAt=v==='cooking'?Date.now()+15*6e4:0;admR()}
function setMin(i,v){const d=A.dishes[i];d.status='cooking';d.readyMin=Number(v)||15;sv('dishes');d.readyAt=Date.now()+d.readyMin*6e4;delete d.readyMin;admR()}
async function logv(){const L2=await api('/api/admin/log');$('lg').innerHTML=L2.map(x=>box(`<div class="hint">${x.t} · <b>${esc(x.w)}</b></div>${esc(x.a)}`)).join('')||'<div class="empty">Журнал пуст</div>'}
async function bnow(){const r=await api('/api/admin/backup-now',{});alert(r.ok?'Отправлено админам в Telegram':'Ошибка')}
const tgl=(i,x,on)=>{const d=A.dishes[i];d.tags=(d.tags||[]).filter(y=>y!==x);if(on)d.tags.push(x);sv('dishes')};
function addT(){const v=$('nt').value.trim();if(!v||A.tables.some(x=>x.id===v))return alert('Введите уникальный номер');A.tables.push({id:v,name:'Стол '+v});sv('tables');admR()}
function addC(){const n=$('cn').value.trim();if(!n)return;pic($('cp'),im=>{A.cats.push({id:'c'+uid(),t:n,img:im});sv('cats');admR()})}
function addD(){const n=$('dn').value.trim(),p=Number($('dp').value);if(!n||!p||!$('dc').value)return alert('Укажите каталог, название и цену');
 pic($('dpic'),im=>{A.dishes.push({id:'d'+uid(),c:$('dc').value,n,d:$('dd').value.trim(),p,img:im,dest:'kitchen',tags:[],mods:''});sv('dishes');admR()})}
function addW(){const f=$('wf').value.trim();if(!f)return;A.waiters.push({id:'w'+uid(),fio:f,phone:$('wp').value.trim(),username:$('wu').value.trim(),tables:$('wt').value.trim(),chatId:''});sv('waiters');admR()}
function addA(){const n=$('an').value.trim(),p=$('ap').value;if(!n||!p)return alert('Укажите имя и пароль');A.admins.push({id:'a'+uid(),name:n,role:$('ar').value,pass:p});sv('admins').then(async()=>{A=await api('/api/admin/state');admR()})}
async function saveS(){
 const go=async im=>{const s={...A.settings};SF.forEach(([k])=>s[k]=$('s_'+k).value.trim());s.restaurant=s.restaurant||'Ресторан';s.currency=s.currency||'TJS';s.dayDish=$('s_dayDish').value;if(im)s.promoImg=im;s.newPass=$('s_newPass').value;
  A.settings=s;await sv('settings');$('bs').textContent='Сохранено. Проверяем бота…';setTimeout(async()=>{A=await api('/api/admin/state');admR()},2500)};
 $('sp').files[0]?pic($('sp'),go):go('');
}
async function dl(url,name){const r=await fetch(url,{headers:{'x-token':tok}}),a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=name;a.click()}
function restore(el){const f=el.files[0];if(!f||!confirm('Заменить все данные из файла?'))return;const r=new FileReader();r.onload=async()=>{const x=await api('/api/admin/restore',JSON.parse(r.result));alert(x.ok?'Готово':'Ошибка');A=await api('/api/admin/state');await loadCfg();admR()};r.readAsText(f)}
async function rep(n){const s=await api('/api/admin/report?days='+n),c=D.currency;
 $('rp').innerHTML=`<div class="kp"><div>Выручка<b>${s.revenue} ${c}</b></div><div>Заказов<b>${s.count}</b></div><div>Средний чек<b>${s.avg} ${c}</b></div><div>Чаевые<b>${s.tips} ${c}</b></div><div>Оценка<b>${s.rating||'—'} ⭐</b></div></div>`
 +box('<b>Топ блюд</b>'+s.top.map(x=>`<div class="row"><span>${esc(x.n)} × ${x.q}</span><span>${x.s} ${c}</span></div>`).join(''))
 +box('<b>Официанты</b>'+s.waiters.map(x=>`<div class="row"><span>${esc(x.w)} · ${x.c} зак.</span><span>${x.s} ${c}</span></div>`).join(''))
 +box('<b>По дням</b>'+s.days.map(x=>`<div class="row"><span>${x.d} · ${x.c} зак.</span><span>${x.s} ${c}</span></div>`).join(''))}
async function hist(){const L2=await api('/api/admin/orders'),S={new:'новый',confirmed:'ждёт официанта',accepted:'в работе',closed:'закрыт',rejected:'отклонён'};
 $('hs').innerHTML=L2.map(o=>box(`<div class="row" style="border:0;padding:0"><b>№${o.id} · ${esc(o.table)}</b><span>${o.total} ${D.currency}</span></div><div class="hint">${o.t} · ${S[o.status]}${o.waiter?' · '+esc(o.waiter):''}${o.rating?' · '+o.rating+'⭐':''}</div>${o.review?`<div class="hint">💬 ${esc(o.review)}</div>`:''}${o.status==='closed'?`<a href="/api/order/${o.id}/receipt.pdf" target="_blank" style="color:var(--gold);font-size:13px">🧾 Чек PDF</a>`:''}`)).join('')||'<div class="empty">Пока нет заказов</div>'}
function dlQR(i){const x=A.tables[i],s=$('qr'+i).querySelector('canvas'),c=document.createElement('canvas');c.width=400;c.height=480;const g=c.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,400,480);g.imageSmoothingEnabled=false;g.drawImage(s,40,30,320,320);g.fillStyle='#000';g.textAlign='center';g.font='bold 32px sans-serif';g.fillText(x.name,200,405);g.font='20px sans-serif';g.fillText(D.restaurant,200,442);
 const a=document.createElement('a');a.download='qr-'+x.id+'.png';a.href=c.toDataURL();a.click()}
loadCfg().then(render).catch(()=>{$('app').innerHTML='<div class="empty">Не удалось загрузить меню</div>'});
</script></body></html>
